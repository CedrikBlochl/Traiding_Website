
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>trading-webseite</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="marke"><span class="markenzeichen">↗</span> trading-webseite</div>
        <span class="kopftext">Marktübersicht</span>
    </header>

    <main>
        <p class="klein">DEIN TRADING-DASHBOARD</p>
        <h1>Kryptowährungen</h1>
        <p class="beschreibung">Wähle eine Kryptowährung aus, um ihre Informationen anzusehen.</p>

        <div class="auswahl">
            <button class="coin aktiv" onclick="anzeigen('Bitcoin', 'BTC', '65.000 €', 'bitcoin.svg', this)">
                <img src="Bilder/bitcoin.svg" alt="Bitcoin-Logo">
                <span class="coindaten"><strong>Bitcoin</strong><small>BTC</small></span>
                <b>65.000 €</b>
            </button>

            <button class="coin" onclick="anzeigen('Ethereum', 'ETH', '3.200 €', 'ethereum.svg', this)">
                <img src="Bilder/ethereum.svg" alt="Ethereum-Logo">
                <span class="coindaten"><strong>Ethereum</strong><small>ETH</small></span>
                <b>3.200 €</b>
            </button>

            <button class="coin" onclick="anzeigen('Solana', 'SOL', '150 €', 'solana.svg', this)">
                <img src="Bilder/solana.svg" alt="Solana-Logo">
                <span class="coindaten"><strong>Solana</strong><small>SOL</small></span>
                <b>150 €</b>
            </button>
        </div>

        <section class="karte">
            <div class="kartenkopf">
                <span>Ausgewählte Kryptowährung</span>
                <span class="demo">BEISPIELDATEN</span>
            </div>

            <div class="details">
                <img id="bild" src="Bilder/bitcoin.svg" alt="Ausgewählte Kryptowährung">
                <div>
                    <h2 id="name">Bitcoin</h2>
                    <p id="symbol">BTC</p>
                </div>
            </div>

            <p class="preistitel">Beispielpreis</p>
            <p id="preis" class="preis">65.000 €</p>
            <p class="hinweis">Die Preise sind feste Beispielzahlen und keine Live-Kurse.</p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
